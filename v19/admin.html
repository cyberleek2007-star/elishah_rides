<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Elishah Rides — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body class="admin-login-body">
<main class="login-screen">
  <div class="login-card">
    <a class="brand login-brand" href="index.html"><span>ELISHAH</span><small>RIDES</small></a>
    <p class="eyebrow">SECURE ADMIN</p>
    <h1>Welcome back</h1>
    <p class="login-copy">Sign in to manage Elishah Rides bookings, vehicles and pricing.</p>
    <form id="loginForm" class="login-form">
      <label>Email<input id="email" type="email" placeholder="Admin email" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" placeholder="Password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign In</button>
      <p id="loginMsg" class="login-msg"></p>
    </form>
    <a class="back-site" href="index.html">← Back to website</a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script><script src="admin.js"></script>
</body></html>
