<header class="admin-mobile-top"><a class="brand" href="dashboard.html"><span>ELISHAH</span><small>RIDES</small></a><button id="mobileMenu" type="button">☰</button></header><main class="admin-main"><div class="admin-content"><div class="page-heading"><div><p class="eyebrow">OPERATIONS</p><h1>Bookings</h1><p>All customer booking requests from Supabase.</p></div></div>
<div id="adminError" class="admin-alert" hidden></div>
<div class="toolbar admin-toolbar"><input id="search" placeholder="Search reference, name, phone, route…"><select id="filter"><option value="All">All statuses</option><option>Pending</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></div>

<div id="empty" class="empty">No booking requests yet.</div><div id="bookingList" class="booking-list"></div>
<div class="modal" id="bookingDetailModal" aria-hidden="true"><div class="modal-backdrop" data-close-booking-modal></div><div class="modal-card"><button class="modal-close" data-close-booking-modal>×</button><span class="eyebrow">BOOKING DETAILS</span><h2 id="detailRef">Booking</h2><div id="bookingDetailBody"></div><div class="detail-actions"><button class="btn btn-secondary" id="detailWhatsApp">WhatsApp</button><button class="btn btn-secondary" id="detailPaid">Mark Paid</button><button class="btn primary" id="detailConfirm">Confirm Booking</button></div></div></div></div></main>
